apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apache-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paulgroza-mtd/mtd-helm-charts.git
    targetRevision: main
    path: charts/apache-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: apache
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true