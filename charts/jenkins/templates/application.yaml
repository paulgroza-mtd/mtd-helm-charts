apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.jenkins.releaseName }}
  namespace: {{ .Values.argocd.namespace }}
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.jenkins.repoURL }}
    chart: {{ .Values.jenkins.chart }}
    targetRevision: {{ .Values.jenkins.chartVersion }}
    helm:
      releaseName: {{ .Values.jenkins.releaseName }}
      values: |
        controller:
          serviceType: ClusterIP
          additionalPlugins:
            - kubernetes-credentials-provider
            - ansicolor:latest
            - job-dsl
          JCasC:
            defaultConfig: true
            configScripts:
              shared-library: |
                unclassified:
                  globalLibraries:
                    libraries:
                      - name: {{ .Values.library.name }}
                        defaultVersion: {{ .Values.library.defaultVersion }}
                        implicit: {{ .Values.library.implicit }}
                        retriever:
                          modernSCM:
                            scm:
                              git:
                                remote: {{ .Values.library.repoURL }}
                                credentialsId: {{ .Values.library.credentialsId }}
              seed-job: |
                jobs:
                  - script: >
                      pipelineJob('seed-job') {
                        triggers {
                          cron('H/15 * * * *')
                        }
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url('{{ .Values.library.repoURL }}')
                                  credentials('{{ .Values.library.credentialsId }}')
                                }
                                branch('*/{{ .Values.library.defaultVersion }}')
                              }
                            }
                            scriptPath('Jenkinsfile')
                            lightweight(true)
                          }
                        }
                      }
              agent-pod-template: |
                  jenkins:
                    clouds:
                      - kubernetes:
                          name: "kubernetes"
                          templates:
                            - name: "buildah-agent"
                              label: "buildah-agent"
                              namespace: "jenkins"
                              serviceAccount: "jenkins"
                              yaml: |
                                apiVersion: v1
                                kind: Pod
                                spec:
                                  containers:
                                    - name: jnlp
                                      image: jenkins/inbound-agent:latest
                                      resources:
                                        requests:
                                          cpu: 200m
                                          memory: 256Mi
                                    - name: buildah
                                      image: quay.io/buildah/stable:latest
                                      command:
                                        - cat
                                      tty: true
                                      securityContext:
                                        privileged: true
                                      resources:
                                        requests:
                                          cpu: 500m
                                          memory: 1Gi
                                      volumeMounts:
                                        - name: buildah-storage
                                          mountPath: /var/lib/containers
                                  volumes:
                                    - name: buildah-storage
                                      emptyDir: {}
  destination:
    server: {{ .Values.destination.server }}
    namespace: {{ .Values.destination.namespace }}
  syncPolicy:
    automated:
      prune: {{ .Values.syncPolicy.prune }}
      selfHeal: {{ .Values.syncPolicy.selfHeal }}
    syncOptions:
      - CreateNamespace=true